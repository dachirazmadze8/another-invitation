<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Halloween 2026!</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Happy Halloween 2026!</h1>
  <img class="hero" src="image.jpg" alt="Halloween-decorated entrance with pumpkins, candles, lanterns and bats">
  <div class="count" id="count" role="timer" aria-live="off">
    <div class="unit"><span class="num" id="d">--</span><span class="lab">დღე</span></div>
    <div class="unit"><span class="num" id="h">--</span><span class="lab">საათი</span></div>
    <div class="unit"><span class="num" id="m">--</span><span class="lab">წუთი</span></div>
    <div class="unit"><span class="num" id="s">--</span><span class="lab">წამი</span></div>
  </div>
  <p class="done" id="done" hidden>დროა! გელოდებით!</p>

  <section class="details" aria-label="ღონისძიების დეტალები">
    <dl>
      <dt>თარიღი</dt><dd>პარასკევი, 30 ოქტომბერი, 2026</dd>
      <dt>დრო</dt><dd>08:30</dd>
      <dt>ადგილი</dt><dd>სათავო ოფისი</dd>
    </dl>
  </section>

  <a class="btn" href="#">აღმოაჩინეთ მეტი</a>
</main>
<script src="script.js"></script>
</body>
</html>
